<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0b0d">
<title>Para Ana ❤️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0b0b0d;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:22px}
main{width:min(920px,100%);text-align:center}
h1{font-size:clamp(42px,9vw,78px);line-height:1;margin:0 0 12px}
.subtitle{font-size:clamp(16px,4vw,22px);opacity:.82;margin:0 0 25px}
.player{overflow:hidden;border-radius:20px;background:#000;box-shadow:0 18px 55px rgba(0,0,0,.45)}
video{display:block;width:100%;max-height:74vh;background:#000}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:21px}
.button{display:inline-block;padding:14px 24px;border-radius:999px;background:#fff;color:#111;text-decoration:none;font-weight:800;font-size:17px}
.note{font-size:13px;opacity:.58;margin-top:15px}
</style>
</head>
<body>
<main>
<h1>Para Ana ❤️</h1>
<p class="subtitle">Una despedida hecha con mucho cariño</p>
<div class="player">
<video controls playsinline preload="metadata">
<source src="video.mp4" type="video/mp4">
Tu navegador no puede reproducir este vídeo.
</video>
</div>
<div class="actions">
<a class="button" href="video.mp4" download="Despedida_Ana.mp4">Descargar vídeo</a>
</div>
<p class="note">Puedes verlo aquí o guardarlo en tu dispositivo.</p>
</main>
</body>
</html>
